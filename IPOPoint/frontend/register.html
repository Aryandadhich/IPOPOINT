<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register — IPOPoint</title>
  <link rel="stylesheet" href="/static/css/base.css"/>
  <link rel="stylesheet" href="/static/css/layout.css"/>
  <link rel="stylesheet" href="/static/css/components.css"/>
  <link rel="stylesheet" href="/static/css/pages/auth.css"/>
</head>
<body>

<nav id="mainNav">
  <a href="/" class="logo">
    <div class="logo-icon">📈</div>
    IPO<em>Point</em>
  </a>
  <div class="nav-r">
    <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">📈</div>
      <div class="auth-brand">IPO<em>Point</em></div>
    </div>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Start tracking IPOs, check GMP and apply through your broker — free forever</div>

    <div class="general-err" id="generalErr"><span>⚠️</span><span id="generalErrMsg"></span></div>

    <div class="success-state" id="successState">
      <div class="s-icon">🎉</div>
      <h3>Account Created!</h3>
      <p>Welcome to IPOPoint. Redirecting you to the app...</p>
    </div>

    <form id="registerForm">

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-input" type="text" id="name" name="name"
               placeholder="Your full name" autocomplete="name"/>
        <div class="field-err" id="nameErr"><span>⚠</span><span></span></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@example.com" autocomplete="email"/>
        <div class="field-err" id="emailErr"><span>⚠</span><span></span></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pwd-wrap">
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Min 8 chars, 1 uppercase, 1 number"
                 autocomplete="new-password"/>
          <button type="button" class="pwd-toggle" id="pwdToggle">👁</button>
        </div>
        <div class="pwd-strength">
          <div class="strength-bars">
            <div class="s-bar" id="sb1"></div>
            <div class="s-bar" id="sb2"></div>
            <div class="s-bar" id="sb3"></div>
            <div class="s-bar" id="sb4"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
        <div class="pwd-reqs" id="pwdReqs">
          <div class="req" id="req-len"><div class="dot"></div>At least 8 characters</div>
          <div class="req" id="req-upper"><div class="dot"></div>One uppercase letter</div>
          <div class="req" id="req-num"><div class="dot"></div>One number</div>
        </div>
        <div class="field-err" id="passwordErr"><span>⚠</span><span></span></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm">Confirm Password</label>
        <div class="pwd-wrap">
          <input class="form-input" type="password" id="confirm" name="confirm"
                 placeholder="Re-enter your password" autocomplete="new-password"/>
          <button type="button" class="pwd-toggle" id="confirmToggle">👁</button>
        </div>
        <div class="field-err" id="confirmErr"><span>⚠</span><span></span></div>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="terms"/>
        <label for="terms">
          I agree to the <a href="#" onclick="return false">Terms of Service</a>
          and <a href="#" onclick="return false">Privacy Policy</a>
        </label>
      </div>
      <div class="field-err" id="termsErr"><span>⚠</span><span></span></div>

      <button class="btn-submit" type="submit" id="submitBtn">Create Account →</button>
    </form>

    <div class="divider">or</div>
    <button class="btn-google" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-footer">Already have an account? <a href="/login">Log in →</a></div>

  </div>
</div>

<div id="toast"></div>

<script type="module" src="/static/js/theme.js"></script>
<script type="module" src="/static/js/toast.js"></script>
<script type="module" src="/static/js/auth.js"></script>
</body>
</html>
