<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Register — IPOPoint</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{
  --bg:#08090f;--surface:#10121c;--border:#1e2235;--border2:#252840;
  --text:#f0f2ff;--text2:#c8cce8;--muted:#6b7280;
  --blue:#4f8ef7;--blue2:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
  --shadow:0 4px 24px rgba(0,0,0,.5);--shadow-lg:0 12px 48px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f0f2f8;--surface:#ffffff;--border:#dde1f0;--border2:#c8cede;
  --text:#111827;--text2:#374151;--muted:#6b7280;
  --blue:#3b82f6;--blue2:#6366f1;--green:#16a34a;--red:#dc2626;--yellow:#d97706;
  --shadow:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 12px 40px rgba(0,0,0,.12);
}
body{font-family:-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;font-family:inherit}

nav{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(8,9,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
[data-theme="light"] nav{background:rgba(255,255,255,.92)}
.logo{font-size:18px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:6px}
.logo-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;font-size:13px}
.logo span{background:linear-gradient(90deg,var(--blue),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-right{display:flex;align-items:center;gap:8px}
.theme-toggle{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,color .2s}
.theme-toggle:hover{border-color:var(--blue);color:var(--blue)}

.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:var(--bg)}
.auth-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;box-shadow:var(--shadow-lg);animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.auth-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px}
.auth-logo .icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;font-size:20px}
.auth-logo .brand{font-size:22px;font-weight:800;letter-spacing:-1px}
.auth-logo .brand span{background:linear-gradient(90deg,var(--blue),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px;letter-spacing:-.5px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.5}

/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:16px;position:relative}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.form-input{width:100%;padding:12px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.form-input::placeholder{color:var(--muted)}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,142,247,.12)}
.form-input.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.1)}
.form-input.valid{border-color:var(--green)}
.field-err{font-size:11px;color:var(--red);margin-top:4px;display:none;align-items:center;gap:3px}
.field-err.show{display:flex}

/* PASSWORD */
.pwd-wrap{position:relative}
.pwd-wrap .form-input{padding-right:44px}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px}
.pwd-toggle:hover{color:var(--text)}

/* PASSWORD STRENGTH */
.pwd-strength{margin-top:8px}
.strength-bars{display:flex;gap:4px;margin-bottom:5px}
.s-bar{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.strength-label{font-size:11px;font-weight:600}

/* PASSWORD REQUIREMENTS */
.pwd-reqs{margin-top:10px;display:none}
.pwd-reqs.show{display:block}
.req{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:4px;transition:color .2s}
.req.met{color:var(--green)}
.req .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .2s}
.req.met .dot{background:var(--green)}

/* GENERAL ERROR / SUCCESS */
.general-err{display:none;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:500;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red);margin-bottom:16px;align-items:center;gap:8px}
.general-err.show{display:flex}

/* TERMS */
.terms-row{display:flex;align-items:flex-start;gap:10px;margin:16px 0}
.terms-row input[type=checkbox]{width:16px;height:16px;margin-top:1px;flex-shrink:0;accent-color:var(--blue);cursor:pointer}
.terms-row label{font-size:12px;color:var(--muted);line-height:1.5;cursor:pointer}
.terms-row label a{color:var(--blue);font-weight:600}

/* SUBMIT */
.btn-submit{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;cursor:pointer;transition:opacity .15s,transform .15s;box-shadow:0 4px 16px rgba(79,142,247,.3)}
.btn-submit:hover{opacity:.88;transform:translateY(-1px)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-submit .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* DIVIDER + GOOGLE */
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-google{width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:600;background:transparent;border:1.5px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .2s,background .2s}
.btn-google:hover{border-color:var(--blue);background:rgba(79,142,247,.04)}
.google-icon{width:18px;height:18px}

.auth-footer{text-align:center;margin-top:22px;font-size:13px;color:var(--muted)}
.auth-footer a{color:var(--blue);font-weight:600}
.auth-footer a:hover{text-decoration:underline}

/* SUCCESS */
.success-state{display:none;text-align:center;padding:16px 0}
.success-state .s-icon{font-size:52px;margin-bottom:14px}
.success-state h3{font-size:22px;font-weight:800;margin-bottom:8px}
.success-state p{font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo"><div class="logo-icon">📈</div>IPO<span>Point</span></a>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="icon">📈</div>
      <div class="brand">IPO<span>Point</span></div>
    </div>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Start tracking IPOs, check GMP and apply through your broker — free forever</div>

    <div class="general-err" id="generalErr"><span>⚠️</span><span id="generalErrMsg"></span></div>

    <!-- Success -->
    <div class="success-state" id="successState">
      <div class="s-icon">🎉</div>
      <h3>Account Created!</h3>
      <p>Welcome to IPOPoint. Redirecting you to the app...</p>
    </div>

    <form id="registerForm" onsubmit="submitRegister(event)">

      <!-- Name -->
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-input" type="text" id="name" name="name"
               placeholder="Aryan Dadheech" autocomplete="name"/>
        <div class="field-err" id="nameErr"><span>⚠</span><span></span></div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="you@example.com" autocomplete="email"/>
        <div class="field-err" id="emailErr"><span>⚠</span><span></span></div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pwd-wrap">
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Min 8 chars, 1 uppercase, 1 number"
                 autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <button type="button" class="pwd-toggle" id="pwdToggle" onclick="togglePwd('password','pwdToggle')">👁</button>
        </div>
        <div class="pwd-strength">
          <div class="strength-bars">
            <div class="s-bar" id="sb1"></div>
            <div class="s-bar" id="sb2"></div>
            <div class="s-bar" id="sb3"></div>
            <div class="s-bar" id="sb4"></div>
          </div>
          <span class="strength-label" id="strengthLabel" style="color:var(--muted)"></span>
        </div>
        <div class="pwd-reqs" id="pwdReqs">
          <div class="req" id="req-len"><div class="dot"></div>At least 8 characters</div>
          <div class="req" id="req-upper"><div class="dot"></div>One uppercase letter</div>
          <div class="req" id="req-num"><div class="dot"></div>One number</div>
        </div>
        <div class="field-err" id="passwordErr"><span>⚠</span><span></span></div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label class="form-label" for="confirm">Confirm Password</label>
        <div class="pwd-wrap">
          <input class="form-input" type="password" id="confirm" name="confirm"
                 placeholder="Re-enter your password" autocomplete="new-password"/>
          <button type="button" class="pwd-toggle" id="confirmToggle" onclick="togglePwd('confirm','confirmToggle')">👁</button>
        </div>
        <div class="field-err" id="confirmErr"><span>⚠</span><span></span></div>
      </div>

      <!-- Terms -->
      <div class="terms-row">
        <input type="checkbox" id="terms"/>
        <label for="terms">I agree to the <a href="#" onclick="return false">Terms of Service</a> and <a href="#" onclick="return false">Privacy Policy</a></label>
      </div>
      <div class="field-err" id="termsErr"><span>⚠</span><span></span></div>

      <button class="btn-submit" type="submit" id="submitBtn">Create Account →</button>
    </form>

    <div class="divider">or</div>
    <button class="btn-google" onclick="toast('Google signup coming soon','inf')">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="auth-footer">Already have an account? <a href="/login">Log in →</a></div>

  </div>
</div>

<div id="toast" style="position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s"></div>

<script>
// THEME
function toggleTheme(){
  const html=document.documentElement;
  const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);
  document.getElementById('themeToggle').textContent=next==='dark'?'🌙':'☀️';
  localStorage.setItem('ipo-theme',next);
}
(function(){
  const t=localStorage.getItem('ipo-theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeToggle').textContent=t==='dark'?'🌙':'☀️';
})();

// PWD TOGGLE
function togglePwd(inputId,btnId){
  const inp=document.getElementById(inputId),btn=document.getElementById(btnId);
  const isText=inp.type==='text';
  inp.type=isText?'password':'text';
  btn.textContent=isText?'👁':'🙈';
}

// FIELD HELPERS
function showErr(id,msg){
  const inp=document.getElementById(id),err=document.getElementById(id+'Err');
  inp.classList.add('error');inp.classList.remove('valid');
  err.querySelector('span:last-child').textContent=msg;
  err.classList.add('show');
}
function clearErr(id){
  document.getElementById(id).classList.remove('error');
  document.getElementById(id+'Err').classList.remove('show');
}
function markOk(id){
  document.getElementById(id).classList.remove('error');
  document.getElementById(id).classList.add('valid');
  document.getElementById(id+'Err').classList.remove('show');
}

// PASSWORD STRENGTH
function checkStrength(v){
  const reqs=[
    {id:'req-len',   test:/^.{8,}$/},
    {id:'req-upper', test:/[A-Z]/},
    {id:'req-num',   test:/[0-9]/},
  ];
  let score=0;
  reqs.forEach(r=>{
    const met=r.test.test(v);
    if(met) score++;
    document.getElementById(r.id).classList.toggle('met',met);
  });
  if(v.length>12&&/[^A-Za-z0-9]/.test(v)) score=4;

  document.getElementById('pwdReqs').classList.toggle('show',v.length>0);
  const bars=['sb1','sb2','sb3','sb4'];
  const colors=['','#ef4444','#f59e0b','#22c55e','#22c55e'];
  const labels=['','Weak','Fair','Strong','Very Strong'];
  bars.forEach((id,i)=>{
    document.getElementById(id).style.background=i<score?colors[score]:getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  });
  const lbl=document.getElementById('strengthLabel');
  lbl.textContent=v.length?labels[score]:'';
  lbl.style.color=colors[score]||'var(--muted)';
}

// LIVE VALIDATION
document.getElementById('name').addEventListener('blur',function(){
  if(!this.value.trim()||this.value.trim().length<2) showErr('name','Name must be at least 2 characters');
  else markOk('name');
});
document.getElementById('email').addEventListener('blur',function(){
  const v=this.value.trim();
  if(!v) showErr('email','Email is required');
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) showErr('email','Enter a valid email');
  else markOk('email');
});
document.getElementById('password').addEventListener('blur',function(){
  const v=this.value;
  if(!v) showErr('password','Password is required');
  else if(v.length<8) showErr('password','At least 8 characters required');
  else if(!/[A-Z]/.test(v)) showErr('password','At least one uppercase letter required');
  else if(!/[0-9]/.test(v)) showErr('password','At least one number required');
  else markOk('password');
});
document.getElementById('confirm').addEventListener('blur',function(){
  const pwd=document.getElementById('password').value;
  if(!this.value) showErr('confirm','Please confirm your password');
  else if(this.value!==pwd) showErr('confirm','Passwords do not match');
  else markOk('confirm');
});
['name','email','password','confirm'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>clearErr(id));
});

// SUBMIT
async function submitRegister(e){
  e.preventDefault();
  const name   =document.getElementById('name').value.trim();
  const email  =document.getElementById('email').value.trim();
  const pwd    =document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  const terms  =document.getElementById('terms').checked;

  let valid=true;
  if(!name||name.length<2){showErr('name','Name must be at least 2 characters');valid=false}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('email','Enter a valid email');valid=false}
  if(!pwd||pwd.length<8){showErr('password','At least 8 characters required');valid=false}
  else if(!/[A-Z]/.test(pwd)){showErr('password','At least one uppercase letter required');valid=false}
  else if(!/[0-9]/.test(pwd)){showErr('password','At least one number required');valid=false}
  if(pwd&&confirm!==pwd){showErr('confirm','Passwords do not match');valid=false}
  if(!terms){showErr('terms','You must agree to the Terms of Service');valid=false}
  if(!valid) return;

  const btn=document.getElementById('submitBtn');
  btn.innerHTML='<span class="spin"></span>Creating account...';
  btn.disabled=true;
  document.getElementById('generalErr').classList.remove('show');

  try{
    const r=await fetch('/api/auth/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,email,password:pwd})
    });
    const d=await r.json();

    if(!r.ok){
      const errs=d.errors||{};
      if(errs.name)    showErr('name',    errs.name);
      if(errs.email)   showErr('email',   errs.email);
      if(errs.password)showErr('password',errs.password);
      if(errs.general){
        document.getElementById('generalErrMsg').textContent=errs.general;
        document.getElementById('generalErr').classList.add('show');
      }
      return;
    }

    localStorage.setItem('ipo_token', d.token);
    localStorage.setItem('ipo_user',  JSON.stringify(d.user));

    document.getElementById('registerForm').style.display='none';
    document.getElementById('generalErr').style.display='none';
    document.getElementById('successState').style.display='block';

    setTimeout(()=>{ window.location.href='/tracker'; }, 1500);

  }catch(err){
    document.getElementById('generalErrMsg').textContent='Network error. Please try again.';
    document.getElementById('generalErr').classList.add('show');
  }finally{
    btn.innerHTML='Create Account →'; btn.disabled=false;
  }
}

let tt;
function toast(msg,type='inf'){
  const el=document.getElementById('toast');
  const colors={ok:'#0f2a1a/#22c55e',err:'#2d1515/#ef4444',inf:'#0f1f3d/#4f8ef7'};
  const [bg,color]=(colors[type]||colors.inf).split('/');
  Object.assign(el.style,{background:bg,color,border:`1px solid ${color}33`,opacity:'1',transform:'translateY(0)',transition:'opacity .25s'});
  el.textContent=msg;
  clearTimeout(tt); tt=setTimeout(()=>el.style.opacity='0',3200);
}

// Auto-redirect
(function(){
  const token=localStorage.getItem('ipo_token');
  if(token){
    fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}})
      .then(r=>{if(r.ok) window.location.href='/tracker'})
      .catch(()=>{});
  }
})();
</script>
</body>
</html>
